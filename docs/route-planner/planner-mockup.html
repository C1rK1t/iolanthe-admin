<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Planner mockup</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg: #12333d;
  --panel: #ffffff;
  --ink: #172026;
  --muted: #5f6b73;
  --line: #d7dde1;
  --accent: #176f7a;
  --accent-dark: #0e4f58;
  --danger: #a93d35;
  --ok: #2f9a61;
  --warn: #b7791f;
  --pin: #e8862a;
  --stop: #1f6fd1;
  --site: #c0392b;
  --shadow: 0 12px 30px rgba(16, 32, 40, 0.18);
}
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
button, input, select, textarea { font: inherit; }
.demo-banner { background: #f6e7b8; color: #4d3b06; padding: 8px 16px; font-size: 14px; text-align: center; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #fff; }
.top h1 { font-size: 20px; margin: 0; font-weight: 700; }
.top .dept { opacity: .75; font-size: 14px; }
.shell { display: grid; grid-template-columns: 190px 1fr; gap: 16px; padding: 0 16px 16px; }
.section-nav { display: flex; flex-direction: column; gap: 8px; }
.section-nav button { min-height: 44px; border: 0; border-radius: 6px; background: rgba(255,255,255,.12); color: #fff; font-weight: 700; text-align: left; padding: 0 14px; cursor: pointer; }
.section-nav button[aria-pressed="true"] { background: #fff; color: var(--ink); }
.section-nav .new { font-size: 11px; background: var(--ok); color: #fff; border-radius: 999px; padding: 2px 7px; margin-left: 6px; vertical-align: 2px; }
.card { background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card-header h2 { margin: 0; font-size: 20px; flex: 1; min-width: 120px; }
.icon-row { display: flex; gap: 8px; flex-wrap: wrap; }
.icon-btn { width: 40px; height: 40px; border: 0; border-radius: 6px; display: inline-grid; place-items: center; cursor: pointer; background: #e8eef0; color: var(--ink); }
.icon-btn:hover { background: #d8e2e5; }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn.success { background: var(--ok); color: #fff; }
.icon-btn.success:hover { background: #237347; }
.icon-btn.danger { background: var(--danger); color: #fff; }
.icon-btn.danger:hover { background: #b93434; }
.icon-btn:disabled { opacity: .4; cursor: not-allowed; }
.icon-sep { width: 1px; background: var(--line); margin: 0 4px; }
.planner { display: grid; grid-template-columns: 340px 1fr; gap: 16px; min-height: 640px; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.side label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.side input[type=text], .side input[type=number], .side textarea, .side select, .modal input[type=text], .modal input[type=number], .modal textarea {
  width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: #fff; color: var(--ink);
}
textarea { resize: vertical; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: #f1f5f6; border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.readonly-note { background: #eef3fb; color: #1d3f6e; border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; }
.stops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.stops li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.stops .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--stop); color: #fff; font-size: 12px; font-weight: 700; margin-right: 6px; }
.stops .served { margin: 6px 0 0 28px; font-size: 13px; color: var(--muted); }
.stops .served span { display: inline-block; background: #fbeaea; color: #8a2a20; border-radius: 999px; padding: 1px 8px; margin: 2px 4px 0 0; }
.stops .warnbadge { color: var(--warn); font-size: 12px; margin-left: 6px; }
.stops button.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; margin-left: 28px; margin-top: 4px; }
table.legs { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.legs th, table.legs td { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: left; }
table.legs td.n, table.legs th.n { text-align: right; }
.muted { color: var(--muted); font-size: 13px; }
.mapwrap { position: relative; border-radius: 10px; overflow: hidden; min-height: 640px; }
#map { position: absolute; inset: 0; background: #0b2730; }
.toolbar { position: absolute; top: 10px; left: 10px; z-index: 500; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.toolgroup { display: flex; background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.3); overflow: hidden; }
.toolgroup button { border: 0; background: #fff; padding: 0 12px; height: 40px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.toolgroup button + button { border-left: 1px solid var(--line); }
.toolgroup button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.toolgroup button:disabled { opacity: .4; cursor: not-allowed; }
.toolgroup svg { width: 18px; height: 18px; }
.hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 500; background: rgba(16,32,40,.85); color: #fff; padding: 7px 14px; border-radius: 999px; font-size: 13px; pointer-events: none; text-align: center; max-width: 90%; }
.layers { position: absolute; top: 10px; right: 10px; z-index: 500; background: #fff; border-radius: 8px; padding: 8px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.3); font-size: 13px; }
.layers label { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; }
.layers i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
/* markers */
.pt { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--accent-dark); box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.pt.first { border-color: var(--ok); }
.pt.sel { outline: 3px solid #ffd54a; }
.mid { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.55); border: 2px dashed #fff; cursor: grab; }
.stopm { width: 28px; height: 28px; border-radius: 50%; background: var(--stop); color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.6); }
.anch { width: 26px; height: 26px; border-radius: 50%; background: rgba(31,111,209,.55); border: 2px solid rgba(255,255,255,.85); display: grid; place-items: center; color: #fff; }
.anch svg, .stopm svg { width: 16px; height: 16px; }
.sitem { width: 18px; height: 18px; background: var(--site); border: 2px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.pinm { width: 18px; height: 18px; background: var(--pin); border: 2px solid #fff; border-radius: 4px; transform: rotate(45deg); box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.leaflet-tooltip.lbl { background: rgba(16,32,40,.85); color: #fff; border: 0; box-shadow: none; font-size: 12px; font-weight: 700; }
.leaflet-tooltip.lbl::before { display: none; }
.popup { min-width: 210px; display: flex; flex-direction: column; gap: 6px; }
.popup h4 { margin: 0 0 2px; font-size: 14px; }
.popup input { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; }
.popup button { border: 0; border-radius: 5px; padding: 7px 10px; background: #e8eef0; cursor: pointer; text-align: left; font-weight: 700; font-size: 13px; }
.popup button:hover { background: #d8e2e5; }
.popup button.del { background: #f7e2e0; color: var(--danger); }
.popup .meta { font-size: 12px; color: var(--muted); }
/* modals */
.backdrop { position: fixed; inset: 0; background: rgba(8,20,26,.55); z-index: 2000; display: grid; place-items: center; padding: 16px; }
.modal { background: #fff; border-radius: 10px; box-shadow: var(--shadow); width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 16px; }
.modal .card-header h2 { font-size: 18px; }
.modal .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal .full { grid-column: 1 / -1; }
.modal label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); }
.modal label > input, .modal label > textarea { margin-top: 4px; }
.checklist { display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow: auto; }
.checklist label { display: flex; gap: 8px; align-items: center; font-weight: 400; color: var(--ink); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); }
.checklist label.near { border-color: #e4b7b2; background: #fdf4f3; }
.checklist .d { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.radios { display: flex; flex-direction: column; gap: 4px; }
.radios label { display: flex; gap: 8px; align-items: center; font-weight: 400; color: var(--ink); }
.modal .err { color: var(--danger); font-size: 13px; min-height: 1em; }
.modal p { margin: 0 0 10px; }
.btn { border: 0; border-radius: 6px; padding: 9px 14px; font-weight: 700; cursor: pointer; background: #e8eef0; }
.btn.primary { background: var(--accent); color: #fff; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #173b45; color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 3000; font-size: 14px; box-shadow: var(--shadow); }
/* itinerary mock */
.itin-plan { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
.itin-plan h3 { margin: 0 0 10px; font-size: 16px; }
.route-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.route-row select { min-height: 40px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; min-width: 220px; }
.banner { margin-top: 10px; background: #fff4de; border: 1px solid #f0d49a; border-radius: 8px; padding: 8px 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
@media (max-width: 1100px) { .planner { grid-template-columns: 1fr; } .mapwrap { min-height: 520px; order: -1; } }
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .section-nav { flex-direction: row; overflow-x: auto; }
  .section-nav button { white-space: nowrap; }
  .toolgroup button span.lbl { display: none; }
  .layers { top: auto; right: auto; bottom: 34px; left: 10px; padding: 6px 10px; }
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="demo-banner">Mockup of the proposed Routes panel. Demo data only and nothing is saved. The map needs an internet connection.</div>
<div class="top"><h1>Princess Iolanthe Admin</h1><span class="dept">Charter Admin · Bridge</span></div>
<div class="shell">
  <nav class="section-nav" id="nav">
    <button data-tab="info" aria-pressed="false">Charter Info</button>
    <button data-tab="itinerary" aria-pressed="false">Itinerary</button>
    <button data-tab="crew" aria-pressed="false">Crew</button>
    <button data-tab="routes" aria-pressed="true">Routes<span class="new">new</span></button>
    <button data-tab="sites" aria-pressed="false">Site Editor</button>
  </nav>
  <main id="workspace"></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  "use strict";

  // ---------- icons ----------
  const ICON = {
    save: '<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
    cancel: '<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
    add: '<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
    saveas: '<rect x="8" y="8" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M5 15V6a1 1 0 0 1 1-1h9" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>',
    import: '<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    export: '<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    trash: '<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>',
    pointer: '<path d="M6 4l12 7-5.5 1.5L10 18z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    pen: '<circle cx="6" cy="18" r="2" fill="currentColor"/><circle cx="18" cy="6" r="2" fill="currentColor"/><path d="M7.5 16.5l9-9" stroke="currentColor" stroke-width="2"/>',
    eraser: '<path d="M4 16l8-8 6 6-5 5H8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13 19h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    anchor: '<circle cx="12" cy="5" r="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v13M8 11h8M5 14a7 6 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    undo: '<path d="M9 7L5 11l4 4M5 11h9a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>',
    redo: '<path d="M15 7l4 4-4 4M19 11h-9a5 5 0 0 0 0 10h2" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>'
  };
  const svg = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`;
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const clone = v => JSON.parse(JSON.stringify(v));
  const slug = v => String(v || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "route";

  // ---------- geo ----------
  const R_NM = 3440.065;
  const rad = d => d * Math.PI / 180;
  function distNm(a, b) {
    const dLat = rad(b.latitude - a.latitude), dLon = rad(b.longitude - a.longitude);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.latitude)) * Math.cos(rad(b.latitude)) * Math.sin(dLon / 2) ** 2;
    return 2 * R_NM * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function bearing(a, b) {
    const y = Math.sin(rad(b.longitude - a.longitude)) * Math.cos(rad(b.latitude));
    const x = Math.cos(rad(a.latitude)) * Math.sin(rad(b.latitude)) - Math.sin(rad(a.latitude)) * Math.cos(rad(b.latitude)) * Math.cos(rad(b.longitude - a.longitude));
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }
  const routeLength = pts => pts.slice(1).reduce((t, p, i) => t + distNm(pts[i], p), 0);
  const fmtNm = n => n < 10 ? n.toFixed(1) : Math.round(n).toString();
  const fmtPos = p => `${Math.abs(p.latitude).toFixed(4)}°${p.latitude >= 0 ? "N" : "S"} ${Math.abs(p.longitude).toFixed(4)}°${p.longitude >= 0 ? "E" : "W"}`;

  // Douglas-Peucker in metres (local equirectangular projection)
  function simplify(pts, tolM) {
    if (tolM <= 0 || pts.length < 3) return pts.slice();
    const lat0 = rad(pts[0].latitude);
    const xy = pts.map(p => [rad(p.longitude) * Math.cos(lat0) * 6371000, rad(p.latitude) * 6371000]);
    const keep = new Array(pts.length).fill(false);
    keep[0] = keep[pts.length - 1] = true;
    const stack = [[0, pts.length - 1]];
    while (stack.length) {
      const [s, e] = stack.pop();
      let maxD = 0, idx = -1;
      const [x1, y1] = xy[s], [x2, y2] = xy[e];
      const dx = x2 - x1, dy = y2 - y1, len2 = dx * dx + dy * dy;
      for (let i = s + 1; i < e; i++) {
        const [x, y] = xy[i];
        let t = len2 ? ((x - x1) * dx + (y - y1) * dy) / len2 : 0;
        t = Math.max(0, Math.min(1, t));
        const d = Math.hypot(x - (x1 + t * dx), y - (y1 + t * dy));
        if (d > maxD) { maxD = d; idx = i; }
      }
      if (maxD > tolM && idx > 0) { keep[idx] = true; stack.push([s, idx], [idx, e]); }
    }
    return pts.filter((_, i) => keep[i]);
  }

  // ---------- demo data ----------
  const sites = [
    { id: "coron-wrecks", title: "Coron Wrecks", latitude: 11.977719, longitude: 120.043203, description: "WWII Japanese wrecks, 10–40 m." },
    { id: "coron-island", title: "Coron Island", latitude: 11.954372, longitude: 120.213719, description: "Kayangan and Barracuda lakes." },
    { id: "dugong-sanctury", title: "Dugong Sanctury", latitude: 12.325233, longitude: 119.907272, description: "Snorkel with dugongs, early morning." },
    { id: "black-island", title: "Black Island", latitude: 12.154694, longitude: 119.819419, description: "Limestone island, caves and beach." },
    { id: "debotunay-island", title: "Debotunay Island", latitude: 12.106578, longitude: 119.852153, description: "Quiet beach and reef." },
    { id: "port-caltom", title: "Port Caltom", latitude: 12.177978, longitude: 120.094689, description: "Sheltered bay, village visit." }
  ];
  let anchorages = [
    { id: "coron-town", name: "Coron Town", latitude: 11.9985, longitude: 120.2003, depth_m: 12, notes: "Mud, good holding. Busy with bancas by day." },
    { id: "lusong-gunboat", name: "Lusong Gunboat", latitude: 11.9620, longitude: 120.0570, depth_m: 15, notes: "Day anchorage for the wrecks." },
    { id: "black-island-bay", name: "Black Island Bay", latitude: 12.1500, longitude: 119.8290, depth_m: 18, notes: "Open to the SW. Sand." },
    { id: "port-caltom-anch", name: "Port Caltom", latitude: 12.1715, longitude: 120.0905, depth_m: 9, notes: "Well sheltered, all but N." },
    { id: "dimakya", name: "Dimakya Island", latitude: 12.1550, longitude: 119.9710, depth_m: 20, notes: "Deep close in; tie off stern if calm." }
  ];
  const A = id => anchorages.find(a => a.id === id);
  const stopFrom = (a, siteIds) => ({ latitude: a.latitude, longitude: a.longitude, anchorage_id: a.id, name: a.name, site_ids: siteIds || [] });
  let library = [
    {
      id: "coron-loop", name: "Coron loop", description: "Coron Town, wrecks, Black Island, north to the dugongs and back via Port Caltom.",
      revision: 4, updated_at: "2026-10-04T08:12:00Z", source: { type: "planner" },
      points: [
        stopFrom(A("coron-town"), ["coron-island"]),
        { latitude: 11.985, longitude: 120.150 },
        stopFrom(A("lusong-gunboat"), ["coron-wrecks"]),
        { latitude: 12.020, longitude: 119.960 },
        { latitude: 12.090, longitude: 119.880 },
        stopFrom(A("black-island-bay"), ["black-island", "debotunay-island"]),
        { latitude: 12.240, longitude: 119.880 },
        { latitude: 12.300, longitude: 119.930, site_id: "dugong-sanctury", name: "Dugong Sanctury" },
        { latitude: 12.230, longitude: 120.030 },
        stopFrom({ ...A("port-caltom-anch") }, ["port-caltom"]),
        { latitude: 12.080, longitude: 120.160 },
        stopFrom(A("coron-town"), [])
      ]
    },
    {
      id: "wrecks-day-trip", name: "Wrecks day trip", description: "Short hop from Coron Town to the wrecks.",
      revision: 1, updated_at: "2026-09-20T05:40:00Z", source: { type: "planner" },
      points: [stopFrom(A("coron-town"), []), { latitude: 11.985, longitude: 120.150 }, stopFrom(A("lusong-gunboat"), ["coron-wrecks"])]
    }
  ];
  // Port Caltom anchorage was moved after this route was saved, to show the "moved" warning.
  A("port-caltom-anch").latitude = 12.1745;
  const charterCopies = [
    {
      id: "copy-csaba-primary", name: "Csaba — Primary", readonly: true, description: "Assigned 2026-08-02. Charter ended 2026-08-09.",
      revision: 1, updated_at: "2026-08-02T09:00:00Z", source: { type: "library", route_id: "coron-loop", charter_id: "csaba", plan: "primary" },
      points: [stopFrom(A("coron-town"), ["coron-island"]), { latitude: 11.985, longitude: 120.150 }, stopFrom(A("lusong-gunboat"), ["coron-wrecks"]), { latitude: 12.06, longitude: 120.05 }, stopFrom(A("port-caltom-anch"), ["port-caltom"])]
    }
  ];

  // ---------- state ----------
  const state = {
    tab: "routes",
    current: null,       // working copy of the route
    savedSnapshot: "",   // JSON of route at last save/load
    readonly: false,
    mode: "select",
    undo: [], redo: [],
    pins: [],            // temporary imported pins
    layers: { sites: true, anchorages: true, pins: true },
    speed: 8
  };
  let map = null, layers = {};

  const routeKey = r => JSON.stringify({ n: r.name, d: r.description, p: r.points });
  const isDirty = () => state.current && routeKey(state.current) !== state.savedSnapshot;

  function loadRoute(route, readonly) {
    state.current = clone(route);
    state.current.points.forEach(p => { if (p.anchorage_id && !p.site_ids) p.site_ids = []; });
    state.savedSnapshot = routeKey(state.current);
    state.readonly = !!readonly;
    state.undo = []; state.redo = [];
    state.mode = "select";
  }
  loadRoute(library[0], false);

  function pushHistory() {
    state.undo.push(JSON.stringify(state.current.points));
    if (state.undo.length > 200) state.undo.shift();
    state.redo = [];
  }
  function undo() { if (!state.undo.length) return; state.redo.push(JSON.stringify(state.current.points)); state.current.points = JSON.parse(state.undo.pop()); refresh(); }
  function redo() { if (!state.redo.length) return; state.undo.push(JSON.stringify(state.current.points)); state.current.points = JSON.parse(state.redo.pop()); refresh(); }

  function toast(msg) {
    const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  // ---------- modals (green save + red cancel top right, click outside cancels) ----------
  function openModal({ title, body, onSave, saveLabel = "Save", extraActions = "", noSave = false }) {
    const bd = document.createElement("div");
    bd.className = "backdrop";
    bd.innerHTML = `<div class="modal" role="dialog" aria-label="${esc(title)}">
      <div class="card-header"><h2>${esc(title)}</h2><div class="icon-row">
        ${extraActions}
        ${noSave ? "" : `<button class="icon-btn success" data-save title="${esc(saveLabel)}" aria-label="${esc(saveLabel)}">${svg("save")}</button>`}
        <button class="icon-btn danger" data-cancel title="Cancel" aria-label="Cancel">${svg("cancel")}</button>
      </div></div>
      <div class="modal-body">${body}</div><p class="err" data-err></p></div>`;
    document.body.appendChild(bd);
    const close = () => { bd.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = e => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    bd.addEventListener("mousedown", e => { if (e.target === bd) close(); });
    bd.querySelector("[data-cancel]").addEventListener("click", close);
    const saveBtn = bd.querySelector("[data-save]");
    if (saveBtn) saveBtn.addEventListener("click", () => {
      try { if (onSave(bd) !== false) close(); } catch (err) { bd.querySelector("[data-err]").textContent = err.message; }
    });
    const first = bd.querySelector("input, textarea, select");
    if (first) setTimeout(() => first.focus(), 30);
    return { el: bd, close };
  }
  function confirmModal(title, message, onYes, yesLabel = "Continue") {
    openModal({ title, body: `<p>${esc(message)}</p>`, onSave: () => { onYes(); }, saveLabel: yesLabel });
  }
  function guardDiscard(next) {
    const pinsLeft = state.pins.length;
    if (!isDirty() && !pinsLeft) return next();
    const parts = [];
    if (isDirty()) parts.push("this route has unsaved changes");
    if (pinsLeft) parts.push(`${pinsLeft} imported pin${pinsLeft === 1 ? " hasn't" : "s haven't"} been promoted and will be lost`);
    confirmModal("Discard changes?", `${parts.join(", and ").replace(/^./, c => c.toUpperCase())}. Discard and continue?`, () => { state.pins = []; next(); }, "Discard");
  }

  // ---------- anchorage + site modals ----------
  function anchorageModal(existing, latlng, onSaved) {
    const a = existing || { id: "", name: "", latitude: latlng.lat, longitude: latlng.lng, depth_m: "", notes: "" };
    const usedBy = existing ? library.filter(r => r.points.some(p => p.anchorage_id === existing.id)).map(r => r.name) : [];
    const m = openModal({
      title: existing ? "Edit Anchorage" : "Add Anchorage",
      extraActions: existing ? `<button class="icon-btn" data-del title="Delete anchorage" aria-label="Delete anchorage">${svg("trash")}</button>` : "",
      body: `<div class="grid">
        <label class="full">Name<input type="text" id="an-name" value="${esc(a.name)}"></label>
        <label>Latitude<input type="number" step="0.0001" id="an-lat" value="${a.latitude.toFixed ? a.latitude.toFixed(5) : a.latitude}"></label>
        <label>Longitude<input type="number" step="0.0001" id="an-lng" value="${a.longitude.toFixed ? a.longitude.toFixed(5) : a.longitude}"></label>
        <label>Depth (m)<input type="number" step="0.5" min="0" id="an-depth" value="${esc(a.depth_m)}"></label>
        <div class="muted" style="align-self:end">Tip: drag the anchorage on the map to move it.</div>
        <label class="full">Notes<textarea id="an-notes" rows="3" maxlength="500">${esc(a.notes)}</textarea></label>
        ${usedBy.length ? `<p class="muted full">Used in: ${esc(usedBy.join(", "))}</p>` : ""}
      </div>`,
      onSave: bd => {
        const name = bd.querySelector("#an-name").value.trim();
        const lat = Number(bd.querySelector("#an-lat").value), lng = Number(bd.querySelector("#an-lng").value);
        if (!name) throw new Error("Give the anchorage a name.");
        if (!(lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180)) throw new Error("Check the latitude and longitude.");
        const depth = bd.querySelector("#an-depth").value;
        const data = { name, latitude: lat, longitude: lng, depth_m: depth === "" ? "" : Number(depth), notes: bd.querySelector("#an-notes").value.trim() };
        let saved;
        if (existing) { Object.assign(existing, data); saved = existing; }
        else {
          let id = slug(name), n = 2; while (anchorages.some(x => x.id === id)) id = `${slug(name)}-${n++}`;
          saved = { id, ...data }; anchorages.push(saved);
        }
        toast(`Anchorage “${name}” saved.`);
        if (onSaved) onSaved(saved);
        refresh();
      }
    });
    const del = m.el.querySelector("[data-del]");
    if (del) del.addEventListener("click", () => {
      m.close();
      confirmModal("Delete Anchorage", usedBy.length
        ? `“${existing.name}” is used by ${usedBy.join(", ")}. Those routes keep the stop's position and name. Delete it?`
        : `Delete “${existing.name}”?`, () => { anchorages = anchorages.filter(x => x !== existing); toast("Anchorage deleted."); refresh(); }, "Delete");
    });
  }

  function siteModal(existing, latlng, onSaved) {
    const s = existing || { title: "", latitude: latlng.lat, longitude: latlng.lng, description: "" };
    openModal({
      title: existing ? "Edit Site" : "Add Site",
      body: `<p class="muted">This stands in for the existing Site Editor modal, with images, media and tags.</p>
      <div class="grid">
        <label class="full">Title<input type="text" id="si-title" value="${esc(s.title)}"></label>
        <label>Latitude<input type="number" step="0.0001" id="si-lat" value="${Number(s.latitude).toFixed(5)}"></label>
        <label>Longitude<input type="number" step="0.0001" id="si-lng" value="${Number(s.longitude).toFixed(5)}"></label>
        <label class="full">Description<textarea id="si-desc" rows="4">${esc(s.description)}</textarea></label>
      </div>`,
      onSave: bd => {
        const title = bd.querySelector("#si-title").value.trim();
        if (!title) throw new Error("Give the site a title.");
        const data = { title, latitude: Number(bd.querySelector("#si-lat").value), longitude: Number(bd.querySelector("#si-lng").value), description: bd.querySelector("#si-desc").value };
        let saved;
        if (existing) { Object.assign(existing, data); saved = existing; }
        else { saved = { id: slug(title), ...data }; sites.push(saved); }

        if (onSaved) onSaved(saved);
        refresh();
      }
    });
  }

  function sitesServedModal(index) {
    const p = state.current.points[index];
    const list = sites.map(s => ({ s, d: distNm(p, s) })).sort((a, b) => a.d - b.d);
    openModal({
      title: `Sites served from ${p.name || "this stop"}`,
      body: `<p class="muted">Tick the sites guests reach from this stop, for example by tender. Sites within 5 nm are highlighted.</p>
      <div class="checklist">${list.map(({ s, d }) => `
        <label class="${d <= 5 ? "near" : ""}"><input type="checkbox" value="${esc(s.id)}" ${p.site_ids.includes(s.id) ? "checked" : ""}>
        ${esc(s.title)}<span class="d">${fmtNm(d)} nm</span></label>`).join("")}</div>`,
      onSave: bd => {
        pushHistory();
        p.site_ids = Array.from(bd.querySelectorAll("input:checked")).map(i => i.value);
        refresh();
      }
    });
  }

  // ---------- route actions ----------
  function addPoint(pt) { pushHistory(); state.current.points.push(pt); refresh(); }
  function removePoint(i) { pushHistory(); state.current.points.splice(i, 1); refresh(); }

  function saveRoute(asNew) {
    const r = state.current;
    if (!r.name.trim()) { toast("Give the route a name first."); document.getElementById("rt-name")?.focus(); return; }
    if (r.points.length < 2) { toast("A route needs at least two points."); return; }
    if (state.readonly || asNew) {
      openModal({
        title: "Save As New Route",
        body: `<label>Name<input type="text" id="sa-name" value="${esc(state.readonly ? r.name.replace(/ — (Primary|Alternative)$/, "") + " (copy)" : r.name + " (copy)")}"></label>`,
        onSave: bd => {
          const name = bd.querySelector("#sa-name").value.trim();
          if (!name) throw new Error("Name required.");
          let id = slug(name), n = 2; while (library.some(x => x.id === id)) id = `${slug(name)}-${n++}`;
          const route = { ...clone(r), id, name, readonly: false, revision: 1, updated_at: new Date().toISOString(), source: { type: "planner" } };
          library.push(route);
          loadRoute(route, false);
          toast(`Saved as “${name}”.`);
          refresh(true);
        }
      });
      return;
    }
    const idx = library.findIndex(x => x.id === r.id);
    r.revision = (r.revision || 0) + 1; r.updated_at = new Date().toISOString();
    if (idx >= 0) library[idx] = clone(r); else { r.id = r.id || slug(r.name); library.push(clone(r)); }
    state.savedSnapshot = routeKey(r);
    toast(`Route saved (revision ${r.revision}).`);
    refresh(true);
  }

  function newRoute() {
    guardDiscard(() => {
      loadRoute({ id: "", name: "", description: "", revision: 0, points: [], source: { type: "planner" } }, false);
      state.mode = "add";
      refresh(true);
    });
  }

  function deleteRoute() {
    const r = state.current;
    if (state.readonly || !library.some(x => x.id === r.id)) return;
    confirmModal("Delete Route", `Delete “${r.name}” from the library? Charters it was assigned to keep their own copy.`, () => {
      library = library.filter(x => x.id !== r.id);
      loadRoute(library[0] || { id: "", name: "", description: "", points: [] }, false);
      toast("Route deleted.");
      refresh(true);
    }, "Delete");
  }

  // ---------- import / export ----------
  const SAMPLE_KML = (() => {
    // A dense track like a Google Earth / Navionics export, plus a couple of pins.
    const pts = [];
    const ctrl = [[120.2003, 11.9985], [120.15, 11.985], [120.06, 11.965], [119.97, 12.03], [119.86, 12.12], [119.83, 12.15]];
    for (let s = 0; s < ctrl.length - 1; s++) {
      for (let k = 0; k < 40; k++) {
        const t = k / 40;
        const lng = ctrl[s][0] + (ctrl[s + 1][0] - ctrl[s][0]) * t + Math.sin((s * 40 + k) / 3) * 0.0012;
        const lat = ctrl[s][1] + (ctrl[s + 1][1] - ctrl[s][1]) * t + Math.cos((s * 40 + k) / 4) * 0.0010;
        pts.push(`${lng.toFixed(5)},${lat.toFixed(5)},0`);
      }
    }
    pts.push(ctrl[ctrl.length - 1].join(",") + ",0");
    return `<?xml version="1.0"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>
      <Placemark><name>Coron to Black Island</name><LineString><coordinates>${pts.join(" ")}</coordinates></LineString></Placemark>
      <Placemark><name>Skeleton Wreck</name><description>Shallow wreck, good snorkel.</description><Point><coordinates>120.0950,11.9830,0</coordinates></Point></Placemark>
      <Placemark><name>Black Island</name><description>Caves.</description><Point><coordinates>119.8200,12.1540,0</coordinates></Point></Placemark>
      <Placemark><name>Calm cove</name><Point><coordinates>119.9300,12.0700,0</coordinates></Point></Placemark>
    </Document></kml>`;
  })();

  function parseGeoFile(text, filename) {
    const doc = new DOMParser().parseFromString(text, "application/xml");
    if (doc.querySelector("parsererror")) throw new Error("That file isn't valid KML or GPX.");
    const byTag = (el, tag) => Array.from(el.getElementsByTagNameNS("*", tag));
    const childText = (el, tag) => { const c = byTag(el, tag)[0]; return c ? c.textContent.trim() : ""; };
    const lines = [], pins = [];
    if (/\.gpx$/i.test(filename) || doc.documentElement.localName === "gpx") {
      const toPt = el => ({ latitude: Number(el.getAttribute("lat")), longitude: Number(el.getAttribute("lon")), name: childText(el, "name") });
      byTag(doc, "rte").forEach((r, i) => lines.push({ name: childText(r, "name") || `Route ${i + 1}`, points: byTag(r, "rtept").map(toPt) }));
      byTag(doc, "trk").forEach((t, i) => lines.push({ name: childText(t, "name") || `Track ${i + 1}`, points: byTag(t, "trkpt").map(toPt) }));
      byTag(doc, "wpt").forEach(w => pins.push({ ...toPt(w), description: childText(w, "desc") }));
    } else {
      byTag(doc, "Placemark").forEach((pm, i) => {
        const name = Array.from(pm.children).find(c => c.localName === "name")?.textContent.trim() || "";
        const ls = byTag(pm, "LineString")[0];
        const pt = byTag(pm, "Point")[0];
        const coords = el => childText(el, "coordinates").split(/\s+/).filter(Boolean).map(t => { const [lng, lat] = t.split(",").map(Number); return { latitude: lat, longitude: lng }; });
        if (ls) lines.push({ name: name || `Line ${i + 1}`, points: coords(ls) });
        else if (pt) { const [c] = coords(pt); if (c) pins.push({ ...c, name: name || `Pin ${pins.length + 1}`, description: childText(pm, "description") }); }
      });
    }
    lines.forEach(l => { l.points = l.points.filter(p => Number.isFinite(p.latitude) && Number.isFinite(p.longitude)); });
    return { lines: lines.filter(l => l.points.length >= 2), pins: pins.filter(p => Number.isFinite(p.latitude)) };
  }

  function importModal() {
    if (state.readonly) { toast("Charter copies are read-only. Use Save As first."); return; }
    const m = openModal({
      title: "Import KML or GPX",
      saveLabel: "Import",
      body: `<p>Lines become route points and pins become temporary markers you can promote. Pins that aren't promoted aren't saved.</p>
        <div class="grid">
          <label class="full">File<input type="file" id="im-file" accept=".kml,.gpx,application/vnd.google-earth.kml+xml,application/gpx+xml,text/xml"></label>
          <div class="full"><button class="btn" id="im-sample" type="button">Use a sample KML (dense line plus 3 pins)</button></div>
          <div class="full" id="im-detail"></div>
        </div>`,
      onSave: bd => {
        if (!m.parsed) throw new Error("Choose a file first.");
        const { lines, pins } = m.parsed;
        const choice = bd.querySelector("input[name=im-line]:checked")?.value ?? "0";
        const tol = Number(bd.querySelector("#im-tol")?.value || 0);
        const mode = bd.querySelector("input[name=im-mode]:checked")?.value || "replace";
        let pts = [];
        if (lines.length) {
          const raw = choice === "join" ? lines.flatMap(l => l.points) : lines[Number(choice)].points;
          pts = simplify(raw, tol).map(p => ({ latitude: p.latitude, longitude: p.longitude, ...(p.name ? { name: p.name } : {}) }));
        }
        pushHistory();
        if (pts.length) state.current.points = mode === "append" ? state.current.points.concat(pts) : pts;
        if (!state.current.name && lines.length) state.current.name = lines[choice === "join" ? 0 : Number(choice)].name;
        state.pins = state.pins.concat(pins.map(p => ({ ...p, near: nearestLabel(p) })));
        toast(`Imported ${pts.length} points and ${pins.length} pin${pins.length === 1 ? "" : "s"}.`);
        refresh(true);
      }
    });
    const detail = m.el.querySelector("#im-detail");
    const show = (text, filename) => {
      try { m.parsed = parseGeoFile(text, filename); } catch (err) { detail.innerHTML = `<p class="err">${esc(err.message)}</p>`; m.parsed = null; return; }
      const { lines, pins } = m.parsed;
      const autoTol = raw => { for (const t of [0, 5, 10, 20, 30, 50, 75, 100, 150, 200]) if (simplify(raw, t).length <= 60) return t; return 200; };
      const rawFor = c => c === "join" ? lines.flatMap(l => l.points) : (lines[Number(c)] || { points: [] }).points;
      detail.innerHTML = `
        <p><b>${esc(filename)}</b>: ${lines.length} line${lines.length === 1 ? "" : "s"}, ${pins.length} pin${pins.length === 1 ? "" : "s"}.</p>
        ${lines.length > 1 ? `<div class="radios">${lines.map((l, i) => `<label><input type="radio" name="im-line" value="${i}" ${i === 0 ? "checked" : ""}>${esc(l.name)} (${l.points.length} pts)</label>`).join("")}
          <label><input type="radio" name="im-line" value="join">Join all lines in file order</label></div>` : ""}
        ${lines.length ? `<label style="margin-top:10px">Simplify: <span id="im-tolv"></span>
          <input type="range" id="im-tol" min="0" max="200" step="5" value="${autoTol(rawFor("0"))}" style="width:100%"></label>` : ""}
        ${state.current.points.length && lines.length ? `<div class="radios" style="margin-top:8px">
          <label><input type="radio" name="im-mode" value="replace" checked>Replace the current route's points</label>
          <label><input type="radio" name="im-mode" value="append">Append to the end of the current route</label></div>` : ""}`;
      const tolEl = detail.querySelector("#im-tol");
      const upd = () => {
        if (!tolEl) return;
        const c = detail.querySelector("input[name=im-line]:checked")?.value ?? "0";
        const raw = rawFor(c);
        detail.querySelector("#im-tolv").textContent = `${tolEl.value} m tolerance → ${simplify(raw, Number(tolEl.value)).length} of ${raw.length} points`;
      };
      tolEl?.addEventListener("input", upd);
      detail.querySelectorAll("input[name=im-line]").forEach(r => r.addEventListener("change", () => { tolEl.value = autoTol(rawFor(r.value)); upd(); }));
      upd();
    };
    m.el.querySelector("#im-file").addEventListener("change", async e => { const f = e.target.files[0]; if (f) show(await f.text(), f.name); });
    m.el.querySelector("#im-sample").addEventListener("click", () => show(SAMPLE_KML, "sample-coron.kml"));
  }

  function nearestLabel(p) {
    const cands = sites.map(s => ({ n: s.title, d: distNm(p, s), same: s.title.toLowerCase() === (p.name || "").toLowerCase() }))
      .concat(anchorages.map(a => ({ n: a.name, d: distNm(p, a), same: a.name.toLowerCase() === (p.name || "").toLowerCase() })))
      .filter(c => c.same || c.d <= 2).sort((a, b) => (b.same - a.same) || a.d - b.d);
    return cands[0] ? `${cands[0].same ? "Same name as" : "Near"} ${cands[0].n} (${fmtNm(cands[0].d)} nm)` : "";
  }

  function download(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function exportModal() {
    const r = state.current;
    if (r.points.length < 2) { toast("Nothing to export yet."); return; }
    openModal({
      title: "Export Route",
      saveLabel: "Download",
      body: `<div class="radios">
        <label><input type="radio" name="ex" value="gpx" checked>GPX 1.1 (chartplotters: route with named stops as waypoints)</label>
        <label><input type="radio" name="ex" value="kml">KML (Google Earth: line plus stop placemarks)</label></div>`,
      onSave: bd => {
        const fmt = bd.querySelector("input[name=ex]:checked").value;
        const id = r.id || slug(r.name);
        const stops = r.points.filter(p => p.anchorage_id);
        if (fmt === "gpx") {
          const pt = (tag, p, i) => `<${tag} lat="${p.latitude.toFixed(6)}" lon="${p.longitude.toFixed(6)}"><name>${esc(p.name || `WP${String(i + 1).padStart(2, "0")}`)}</name></${tag}>`;
          download(`${id}.gpx`, `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Princess Iolanthe Admin" xmlns="http://www.topografix.com/GPX/1/1">
${stops.map((p, i) => "  " + pt("wpt", p, i)).join("\n")}
  <rte><name>${esc(r.name)}</name><desc>${esc(r.description)}</desc>
${r.points.map((p, i) => "    " + pt("rtept", p, i)).join("\n")}
  </rte>
</gpx>
`, "application/gpx+xml");
        } else {
          download(`${id}.kml`, `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${esc(r.name)}</name>
  <Placemark><name>${esc(r.name)}</name><description>${esc(r.description)}</description><LineString><coordinates>
${r.points.map(p => `    ${p.longitude.toFixed(6)},${p.latitude.toFixed(6)},0`).join("\n")}
  </coordinates></LineString></Placemark>
${stops.map(p => `  <Placemark><name>${esc(p.name)}</name><Point><coordinates>${p.longitude.toFixed(6)},${p.latitude.toFixed(6)},0</coordinates></Point></Placemark>`).join("\n")}
</Document></kml>
`, "application/vnd.google-earth.kml+xml");
        }
        toast(`Downloaded ${id}.${fmt}`);
      }
    });
  }

  // ---------- rendering ----------
  function render() {
    document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === state.tab ? "true" : "false"));
    const ws = document.getElementById("workspace");
    if (map) { map.remove(); map = null; }
    if (state.tab === "itinerary") { ws.innerHTML = itineraryHtml(); bindItinerary(); return; }
    if (state.tab !== "routes") {
      ws.innerHTML = `<section class="card"><div class="card-header"><h2>${esc(document.querySelector(`#nav [data-tab=${state.tab}]`).textContent)}</h2></div><p class="muted">Not part of this mockup. Try <b>Routes</b> or <b>Itinerary</b>.</p></section>`;
      return;
    }
    ws.innerHTML = `
      <section class="card">
        <div class="card-header">
          <h2>Routes</h2>
          <div class="icon-row">
            <button class="icon-btn success" id="act-save" title="Save route" aria-label="Save route">${svg("save")}</button>
            <button class="icon-btn danger" id="act-cancel" title="Discard changes" aria-label="Discard changes">${svg("cancel")}</button>
            <span class="icon-sep"></span>
            <button class="icon-btn" id="act-new" title="New route" aria-label="New route">${svg("add")}</button>
            <button class="icon-btn" id="act-saveas" title="Save as new route" aria-label="Save as new route">${svg("saveas")}</button>
            <button class="icon-btn" id="act-import" title="Import KML or GPX" aria-label="Import KML or GPX">${svg("import")}</button>
            <button class="icon-btn" id="act-export" title="Export GPX or KML" aria-label="Export GPX or KML">${svg("export")}</button>
            <button class="icon-btn" id="act-delete" title="Delete route" aria-label="Delete route">${svg("trash")}</button>
          </div>
        </div>
        <div class="planner">
          <div class="side" id="side"></div>
          <div class="mapwrap">
            <div id="map"></div>
            <div class="toolbar">
              <div class="toolgroup" id="modes">
                <button data-mode="select" title="Select: tap to inspect, drag points to move">${svg("pointer")}<span class="lbl">Select</span></button>
                <button data-mode="add" title="Add points to the end">${svg("pen")}<span class="lbl">Add</span></button>
                <button data-mode="delete" title="Tap points to delete">${svg("eraser")}<span class="lbl">Delete</span></button>
                <button data-mode="anchorage" title="Tap the map to add an anchorage">${svg("anchor")}<span class="lbl">Anchorage</span></button>
              </div>
              <div class="toolgroup">
                <button id="undo" title="Undo (Ctrl+Z)">${svg("undo")}<span class="lbl">Undo</span></button>
                <button id="redo" title="Redo (Ctrl+Y)">${svg("redo")}<span class="lbl">Redo</span></button>
              </div>
            </div>
            <div class="layers" id="layers">
              <label><input type="checkbox" data-layer="sites" ${state.layers.sites ? "checked" : ""}><i style="background:var(--site)"></i>Sites</label>
              <label><input type="checkbox" data-layer="anchorages" ${state.layers.anchorages ? "checked" : ""}><i style="background:var(--stop)"></i>Anchorages</label>
              <label><input type="checkbox" data-layer="pins" ${state.layers.pins ? "checked" : ""}><i style="background:var(--pin);border-radius:2px"></i>Imported pins</label>
            </div>
            <div class="hint" id="hint"></div>
          </div>
        </div>
      </section>`;
    document.getElementById("act-save").onclick = () => saveRoute(false);
    document.getElementById("act-cancel").onclick = () => {
      if (!isDirty()) { toast("No changes to discard."); return; }
      confirmModal("Discard Changes", "Revert this route to its last saved version?", () => {
        const src = library.find(x => x.id === state.current.id) || charterCopies.find(x => x.id === state.current.id);
        if (src) loadRoute(src, state.readonly); else loadRoute({ id: "", name: "", description: "", points: [] }, false);
        refresh(true);
      }, "Discard");
    };
    document.getElementById("act-new").onclick = newRoute;
    document.getElementById("act-saveas").onclick = () => saveRoute(true);
    document.getElementById("act-import").onclick = importModal;
    document.getElementById("act-export").onclick = exportModal;
    document.getElementById("act-delete").onclick = deleteRoute;
    document.querySelectorAll("#modes [data-mode]").forEach(b => b.onclick = () => {
      if (state.readonly && b.dataset.mode !== "select" && b.dataset.mode !== "anchorage") { toast("Charter copies are read-only. Use Save As to edit."); return; }
      state.mode = b.dataset.mode; refresh();
    });
    document.getElementById("undo").onclick = undo;
    document.getElementById("redo").onclick = redo;
    document.querySelectorAll("#layers [data-layer]").forEach(c => c.onchange = () => { state.layers[c.dataset.layer] = c.checked; drawMap(); });
    initMap();
    refresh(true);
  }

  function initMap() {
    map = L.map("map", { zoomControl: false }).setView([12.08, 120.0], 10);
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.control.scale({ position: "bottomleft", metric: true, imperial: false }).addTo(map);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 18, attribution: "Tiles &copy; Esri"
    }).addTo(map);
    ["route", "tender", "anch", "sites", "pins", "points", "mids"].forEach(k => layers[k] = L.layerGroup().addTo(map));
    map.on("click", e => {
      if (state.mode === "add" && !state.readonly) addPoint({ latitude: e.latlng.lat, longitude: e.latlng.lng });
      else if (state.mode === "anchorage") anchorageModal(null, e.latlng);
    });
  }

  function refresh(fit) {
    if (state.tab !== "routes" || !map) return;
    renderSide();
    drawMap();
    document.querySelectorAll("#modes [data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode ? "true" : "false"));
    document.getElementById("undo").disabled = !state.undo.length;
    document.getElementById("redo").disabled = !state.redo.length;
    document.getElementById("act-delete").disabled = state.readonly || !library.some(x => x.id === state.current.id);
    document.getElementById("act-save").title = state.readonly ? "Charter copy: Save As a new route" : "Save route";
    const hints = {
      select: "Drag a point to move it. Drag a faint midpoint to insert one. Tap anything to inspect it.",
      add: "Tap the map to add a point. Tap an anchorage to add a stop, or a site to add a waypoint.",
      delete: "Tap a route point to delete it.",
      anchorage: "Tap the map to add an anchorage. Tap an anchorage to edit it, or drag to move it."
    };
    document.getElementById("hint").textContent = state.readonly ? "Read-only charter copy. Use Save As to make an editable route." : hints[state.mode];
    if (fit) {
      const pts = state.current.points.concat(state.pins);
      if (pts.length >= 2) map.fitBounds(L.latLngBounds(pts.map(p => [p.latitude, p.longitude])).pad(0.15));
      else map.setView([12.08, 120.0], 10);
    }
  }

  function renderSide() {
    const r = state.current, pts = r.points;
    const stops = pts.map((p, i) => ({ p, i })).filter(x => x.p.anchorage_id);
    const len = routeLength(pts);
    const side = document.getElementById("side");
    const option = (x, ro) => `<option value="${ro ? "c:" : "l:"}${esc(x.id)}" ${x.id === r.id ? "selected" : ""}>${esc(x.name)} · ${fmtNm(routeLength(x.points))} nm</option>`;
    side.innerHTML = `
      <div><label for="rt-pick">Route</label>
        <select id="rt-pick">
          ${r.id ? "" : `<option selected>New route (unsaved)</option>`}
          <optgroup label="Library">${library.map(x => option(x, false)).join("")}</optgroup>
          <optgroup label="Charter copies (read-only)">${charterCopies.map(x => option(x, true)).join("")}</optgroup>
        </select></div>
      ${state.readonly ? `<div class="readonly-note">This is the frozen copy assigned to a completed charter. You can view and export it. To change it, use <b>Save As</b> to make a new library route.</div>` : ""}
      <div><label for="rt-name">Name</label><input type="text" id="rt-name" value="${esc(r.name)}" ${state.readonly ? "disabled" : ""} placeholder="e.g. Coron loop"></div>
      <div><label for="rt-desc">Description</label><textarea id="rt-desc" rows="2" ${state.readonly ? "disabled" : ""}>${esc(r.description)}</textarea></div>
      <div class="stats">
        <div class="stat"><b>${fmtNm(len)}</b><span>nm total</span></div>
        <div class="stat"><b>${pts.length}</b><span>points</span></div>
        <div class="stat"><b>${stops.length}</b><span>stops</span></div>
      </div>
      <div>
        <p class="section-title">Stops</p>
        ${stops.length ? `<ol class="stops">${stops.map(({ p, i }, n) => {
          const a = A(p.anchorage_id);
          const moved = a && distNm(a, p) > 0.03;
          return `<li><span class="num">${n + 1}</span><b>${esc(p.name)}</b>
            ${!a ? `<span class="warnbadge">⚠ anchorage deleted</span>` : moved ? `<span class="warnbadge" title="The anchorage is now ${fmtNm(distNm(a, p))} nm from this stop">⚠ anchorage moved</span>` : ""}
            ${a && a.depth_m !== "" ? `<span class="muted"> · ${esc(a.depth_m)} m</span>` : ""}
            <div class="served">${p.site_ids.length ? p.site_ids.map(id => sites.find(s => s.id === id)).filter(Boolean).map(s => `<span>${esc(s.title)}</span>`).join("") : "No sites linked"}</div>
            ${state.readonly ? "" : `<button class="link" data-served="${i}">Edit sites served</button>`}</li>`;
        }).join("")}</ol>` : `<p class="muted">No stops yet. In <b>Add</b> mode, tap an anchorage to make it a stop.</p>`}
      </div>
      <div>
        <p class="section-title">Legs</p>
        <label for="rt-speed" style="display:flex;gap:8px;align-items:center;font-weight:400">Planning speed <input type="number" id="rt-speed" min="1" max="30" step="0.5" value="${state.speed}" style="width:80px;min-height:32px"> kn</label>
        ${pts.length >= 2 ? `<table class="legs"><thead><tr><th>#</th><th>To</th><th class="n">nm</th><th class="n">°T</th><th class="n">h:mm</th></tr></thead><tbody>
          ${pts.slice(1).map((p, i) => {
            const d = distNm(pts[i], p), h = d / state.speed;
            return `<tr><td>${i + 1}</td><td>${esc(p.name || `WP${String(i + 2).padStart(2, "0")}`)}</td><td class="n">${d.toFixed(1)}</td><td class="n">${String(Math.round(bearing(pts[i], p)) % 360).padStart(3, "0")}</td><td class="n">${Math.floor(h)}:${String(Math.round((h % 1) * 60)).padStart(2, "0")}</td></tr>`;
          }).join("")}
          </tbody><tfoot><tr><th></th><th>Total</th><th class="n">${len.toFixed(1)}</th><th></th><th class="n">${(() => { const h = len / state.speed; return `${Math.floor(h)}:${String(Math.round((h % 1) * 60)).padStart(2, "0")}`; })()}</th></tr></tfoot></table>`
          : `<p class="muted">Add at least two points.</p>`}
      </div>
      ${state.pins.length ? `<div><p class="section-title">Imported pins (not saved)</p><p class="muted">${state.pins.length} pin${state.pins.length === 1 ? "" : "s"} on the map. Tap one to add it to the route, or make it an anchorage or a site.</p></div>` : ""}
      <p class="muted">${r.id ? `Revision ${r.revision || 0}` : "Not saved yet"}${isDirty() ? " · <b style=\"color:var(--warn)\">unsaved changes</b>" : ""}</p>`;
    side.querySelector("#rt-pick").onchange = e => {
      const [kind, id] = e.target.value.split(/:(.*)/s);
      const target = kind === "c" ? charterCopies.find(x => x.id === id) : library.find(x => x.id === id);
      e.target.value = `${state.readonly ? "c" : "l"}:${r.id}`;
      guardDiscard(() => { loadRoute(target, kind === "c"); refresh(true); });
    };
    const nameEl = side.querySelector("#rt-name"), descEl = side.querySelector("#rt-desc");
    nameEl.oninput = () => { r.name = nameEl.value; };
    descEl.oninput = () => { r.description = descEl.value; };
    nameEl.onchange = descEl.onchange = () => renderSide();
    side.querySelector("#rt-speed").onchange = e => { const v = Number(e.target.value); if (v > 0) { state.speed = v; renderSide(); } };
    side.querySelectorAll("[data-served]").forEach(b => b.onclick = () => sitesServedModal(Number(b.dataset.served)));
  }

  function divIcon(cls, html = "", size = [14, 14]) {
    return L.divIcon({ className: "", html: `<div class="${cls}">${html}</div>`, iconSize: size, iconAnchor: [size[0] / 2, size[1] / 2] });
  }

  function popupEl(html, handlers) {
    const el = document.createElement("div");
    el.className = "popup"; el.innerHTML = html;
    Object.entries(handlers).forEach(([sel, fn]) => el.querySelectorAll(sel).forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); map.closePopup(); fn(ev); })));
    return el;
  }

  function drawMap() {
    Object.values(layers).forEach(l => l.clearLayers());
    const r = state.current, pts = r.points;
    const ll = p => [p.latitude, p.longitude];
    const routeLine = L.polyline(pts.map(ll), { color: "#ffd54a", weight: 4, opacity: 0.95 }).addTo(layers.route);
    L.polyline(pts.map(ll), { color: "#0b2730", weight: 8, opacity: 0.35 }).addTo(layers.route).bringToBack();
    const usedAnch = new Set(pts.filter(p => p.anchorage_id).map(p => p.anchorage_id));

    // tender lines from stops to their sites
    pts.forEach(p => (p.site_ids || []).forEach(id => {
      const s = sites.find(x => x.id === id);
      if (s && state.layers.sites) L.polyline([ll(p), ll(s)], { color: "#fff", weight: 2, dashArray: "4 6", opacity: 0.8, interactive: false }).addTo(layers.tender);
    }));

    // sites
    if (state.layers.sites) sites.forEach(s => {
      const m = L.marker(ll(s), { icon: L.divIcon({ className: "", html: '<div class="sitem"></div>', iconSize: [18, 18], iconAnchor: [9, 18] }) })
        .bindTooltip(s.title, { className: "lbl", direction: "top", offset: [0, -16] }).addTo(layers.sites);
      m.on("click", () => {
        if (state.mode === "add" && !state.readonly) addPoint({ latitude: s.latitude, longitude: s.longitude, site_id: s.id, name: s.title });
        else siteModal(s);
      });
    });

    // anchorages (unused ones dimmed; draggable in Anchorage mode)
    if (state.layers.anchorages) anchorages.forEach(a => {
      const m = L.marker(ll(a), { icon: divIcon("anch", svg("anchor"), [26, 26]), opacity: usedAnch.has(a.id) ? 0.55 : 0.9, draggable: state.mode === "anchorage" })
        .bindTooltip(`${a.name}${a.depth_m !== "" ? ` · ${a.depth_m} m` : ""}`, { className: "lbl", direction: "top", offset: [0, -14] }).addTo(layers.anch);
      m.on("click", () => {
        if (state.mode === "add" && !state.readonly) addPoint(stopFrom(a, sites.filter(s => distNm(a, s) <= 2).map(s => s.id)));
        else anchorageModal(a);
      });
      m.on("dragend", () => { const p = m.getLatLng(); a.latitude = p.lat; a.longitude = p.lng; toast(`Moved “${a.name}”. Routes using it keep their stop position.`); refresh(); });
    });

    // imported pins
    if (state.layers.pins) state.pins.forEach((p, idx) => {
      const m = L.marker(ll(p), { icon: divIcon("pinm", "", [18, 18]), draggable: true })
        .bindTooltip(p.name, { className: "lbl", direction: "top", offset: [0, -12] }).addTo(layers.pins);
      m.on("dragend", () => { const q = m.getLatLng(); p.latitude = q.lat; p.longitude = q.lng; p.near = nearestLabel(p); });
      m.on("click", () => {
        const promote = () => { state.pins.splice(state.pins.indexOf(p), 1); };
        L.popup().setLatLng(ll(p)).setContent(popupEl(`
          <h4>${esc(p.name)}</h4><div class="meta">Imported pin · ${fmtPos(p)}${p.near ? `<br>⚠ ${esc(p.near)}` : ""}${p.description ? `<br>${esc(p.description)}` : ""}</div>
          ${state.readonly ? "" : `<button data-a="route">Add to end of route</button>`}
          <button data-a="anch">Make anchorage…</button>
          <button data-a="site">Make site…</button>
          <button class="del" data-a="del">Delete pin</button>`, {
          "[data-a=route]": () => { promote(); addPoint({ latitude: p.latitude, longitude: p.longitude, name: p.name }); },
          "[data-a=anch]": () => anchorageModal(null, { lat: p.latitude, lng: p.longitude }, a => { promote(); a.notes = a.notes || p.description || ""; refresh(); }),
          "[data-a=site]": () => siteModal(null, { lat: p.latitude, lng: p.longitude }, () => { promote(); refresh(); }),
          "[data-a=del]": () => { promote(); refresh(); }
        })).openOn(map);
      });
    });

    // route points
    let stopNo = 0;
    const editable = !state.readonly && state.mode !== "delete" && state.mode !== "anchorage";
    pts.forEach((p, i) => {
      const isStop = !!p.anchorage_id;
      const icon = isStop ? divIcon("stopm", String(++stopNo), [28, 28]) : divIcon(`pt${i === 0 ? " first" : ""}`, "", [14, 14]);
      const m = L.marker(ll(p), { icon, draggable: editable, zIndexOffset: isStop ? 900 : 800 }).addTo(layers.points);
      if (p.name) m.bindTooltip(p.name, { className: "lbl", direction: "right", offset: [12, 0] });
      m.on("dragstart", () => pushHistory());
      m.on("drag", () => { const q = m.getLatLng(); p.latitude = q.lat; p.longitude = q.lng; routeLine.setLatLngs(pts.map(ll)); });
      m.on("dragend", () => {
        if (isStop) { delete p.anchorage_id; p.site_ids = []; toast("Stop moved off its anchorage, so it's now a plain waypoint."); }
        refresh();
      });
      m.on("click", () => {
        if (state.mode === "delete" && !state.readonly) { removePoint(i); return; }
        const html = `
          <h4>${isStop ? `Stop ${pts.slice(0, i + 1).filter(x => x.anchorage_id).length}` : `Point ${i + 1}`}${p.name ? `: ${esc(p.name)}` : ""}</h4>
          <div class="meta">${fmtPos(p)}${i > 0 ? ` · ${distNm(pts[i - 1], p).toFixed(1)} nm from previous` : ""}</div>
          ${state.readonly ? "" : `
            <input type="text" data-name placeholder="Label (optional)" value="${esc(p.name || "")}">
            ${isStop ? `<button data-a="served">Sites served (${p.site_ids.length})…</button>` : `<button data-a="anch">Make anchorage (stop)…</button>`}
            <button data-a="site">Make site…</button>
            <button class="del" data-a="del">Delete point</button>`}`;
        const el = popupEl(html, {
          "[data-a=served]": () => sitesServedModal(i),
          "[data-a=anch]": () => anchorageModal(null, { lat: p.latitude, lng: p.longitude }, a => { pushHistory(); Object.assign(p, stopFrom(a, sites.filter(s => distNm(a, s) <= 2).map(s => s.id))); refresh(); }),
          "[data-a=site]": () => siteModal(null, { lat: p.latitude, lng: p.longitude }, s => { if (!isStop) { pushHistory(); p.site_id = s.id; p.name = p.name || s.title; refresh(); } }),
          "[data-a=del]": () => removePoint(i)
        });
        const nameIn = el.querySelector("[data-name]");
        if (nameIn) nameIn.addEventListener("change", () => { pushHistory(); p.name = nameIn.value.trim(); if (!p.name) delete p.name; refresh(); });
        L.popup({ offset: [0, -6] }).setLatLng(ll(p)).setContent(el).openOn(map);
      });
    });

    // midpoint handles (drag to insert)
    if (editable) pts.slice(1).forEach((p, j) => {
      const a = pts[j];
      const mid = L.marker([(a.latitude + p.latitude) / 2, (a.longitude + p.longitude) / 2], { icon: divIcon("mid", "", [12, 12]), draggable: true, zIndexOffset: 700, title: "Drag to insert a point" }).addTo(layers.mids);
      let idx = -1;
      mid.on("dragstart", () => { pushHistory(); const q = mid.getLatLng(); idx = j + 1; pts.splice(idx, 0, { latitude: q.lat, longitude: q.lng }); });
      mid.on("drag", () => { const q = mid.getLatLng(); pts[idx].latitude = q.lat; pts[idx].longitude = q.lng; routeLine.setLatLngs(pts.map(ll)); });
      mid.on("dragend", () => refresh());
      mid.on("click", () => { pushHistory(); pts.splice(j + 1, 0, { latitude: mid.getLatLng().lat, longitude: mid.getLatLng().lng }); refresh(); });
    });
  }

  // ---------- itinerary mock ----------
  const assignments = {
    primary: { route_id: "coron-loop", revision: 3, assigned_at: "2026-10-01" },
    alternative: { route_id: "", revision: 0, assigned_at: "" }
  };
  function itineraryHtml() {
    const row = (planId, label) => {
      const asg = assignments[planId];
      const route = library.find(x => x.id === asg.route_id);
      return `<div class="itin-plan"><h3>${label}</h3>
        <div class="route-row">
          <label for="as-${planId}" class="muted">Route</label>
          <select id="as-${planId}" data-plan="${planId}">
            <option value="">None assigned</option>
            ${library.map(x => `<option value="${esc(x.id)}" ${x.id === asg.route_id ? "selected" : ""}>${esc(x.name)} · ${fmtNm(routeLength(x.points))} nm</option>`).join("")}
          </select>
          ${route ? `<span class="muted">Assigned ${esc(asg.assigned_at)} · rev ${asg.revision}</span>
            <button class="btn" data-open="${esc(route.id)}">Open in planner</button>` : ""}
        </div>
        ${route && route.revision > asg.revision ? `<div class="banner">⚠ <b>${esc(route.name)}</b> has been edited since it was assigned (rev ${asg.revision} → ${route.revision}).
          <button class="btn primary" data-update="${planId}">Update this charter's copy</button><button class="btn" data-keep="${planId}">Keep</button></div>` : ""}
        ${planId === "alternative" && !route ? `<p class="muted" style="margin:10px 0 0">Guests fall back to the Primary route on days that use the Alternative itinerary until an Alternative route is assigned.</p>` : ""}
      </div>`;
    };
    return `<section class="card"><div class="card-header"><h2>Itinerary · route assignment</h2></div>
      <p class="muted">Only the new route rows are mocked here. The day-by-day itinerary editor stays as it is. Assigning copies the route into this charter, so later library edits never change it silently. After the charter's end date these rows become read-only.</p>
      ${row("primary", "Primary Itinerary")}${row("alternative", "Alternative Itinerary")}</section>`;
  }
  function bindItinerary() {
    document.querySelectorAll("[data-plan]").forEach(s => s.onchange = () => {
      const r = library.find(x => x.id === s.value);
      assignments[s.dataset.plan] = r ? { route_id: r.id, revision: r.revision, assigned_at: new Date().toISOString().slice(0, 10) } : { route_id: "", revision: 0, assigned_at: "" };
      toast(r ? `Copied “${r.name}” into this charter's ${s.dataset.plan} route.` : "Route unassigned.");
      render();
    });
    document.querySelectorAll("[data-update]").forEach(b => b.onclick = () => { const a = assignments[b.dataset.update]; a.revision = library.find(x => x.id === a.route_id).revision; toast("Charter copy updated."); render(); });
    document.querySelectorAll("[data-keep]").forEach(b => b.onclick = () => { const a = assignments[b.dataset.keep]; a.revision = library.find(x => x.id === a.route_id).revision; toast("Kept the assigned copy."); render(); });
    document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { loadRoute(library.find(x => x.id === b.dataset.open), false); state.tab = "routes"; render(); });
  }

  // ---------- wiring ----------
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
    if (b.dataset.tab === state.tab) return;
    const go = () => { state.tab = b.dataset.tab; render(); };
    if (state.tab === "routes") guardDiscard(go); else go();
  });
  document.addEventListener("keydown", e => {
    if (state.tab !== "routes" || document.querySelector(".backdrop") || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))) { e.preventDefault(); redo(); }
  });
  if (!window.L) {
    document.getElementById("workspace").innerHTML = `<section class="card"><p>Leaflet couldn't load. This mockup needs an internet connection for the map library and satellite tiles.</p></section>`;
    return;
  }
  render();
})();
</script>
</body>
</html>
